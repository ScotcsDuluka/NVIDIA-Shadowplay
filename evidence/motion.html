<!doctype html>
<html><body style="margin:0;background:#000;overflow:hidden">
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight} resize(); addEventListener('resize',resize);
let t=0;
function loop(){t++; x.fillStyle='#000';x.fillRect(0,0,c.width,c.height);
const w=180,h=180, px=((t*14)%(c.width+w))-w, py=c.height/2-h/2;
x.fillStyle='#fff';x.fillRect(px,py,w,h);
x.fillStyle='#0f0';x.font='48px Consolas';x.fillText('MOTION '+t,40,80);
requestAnimationFrame(loop)} loop();
</script></body></html>
