<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duluka Server — Admin Console</title>
<style>
  :root{
    --bg:#22272b; --panel:#2e3439; --panel2:#343b41; --hover:#3a4147;
    --line:#3d454c; --text:#eceff1; --muted:#9aa4ab;
    --mint:#3fde9e; --blue:#58a6ff; --danger:#f0616d; --warn:#e3b341;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:var(--bg); color:var(--text);
       font:14px/1.45 "Segoe UI",system-ui,sans-serif; padding-bottom:48px}
  header{display:flex; align-items:center; gap:14px; flex-wrap:wrap;
         background:var(--panel); border-bottom:1px solid var(--line);
         padding:14px 22px}
  header h1{font-size:17px; font-weight:600; letter-spacing:.2px}
  header h1 span{color:var(--mint)}
  #dbpath{color:var(--muted); font-size:12px; max-width:46ch; overflow:hidden;
          text-overflow:ellipsis; white-space:nowrap; direction:rtl; text-align:left}
  #live{margin-left:auto; font-size:12px; color:var(--muted)}
  #live b{color:var(--mint)}
  main{max-width:1180px; margin:0 auto; padding:20px 22px}
  /* stat cards */
  #cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px;
        padding:14px 16px}
  .card .num{font-size:26px; font-weight:700; color:var(--mint)}
  .card .lbl{color:var(--muted); font-size:12px; margin-top:2px; letter-spacing:.4px;
             text-transform:uppercase}
  /* tabs */
  #tabs{display:flex; gap:6px; margin:20px 0 12px; flex-wrap:wrap}
  .tab{background:var(--panel); color:var(--muted); border:1px solid var(--line);
       border-radius:8px; padding:8px 18px; cursor:pointer; font-weight:600; font-size:13px}
  .tab:hover{background:var(--hover); color:var(--text)}
  .tab.on{background:var(--mint); color:#14201a; border-color:var(--mint)}
  /* table */
  .wrap{background:var(--panel); border:1px solid var(--line); border-radius:10px;
        overflow-x:auto}
  table{width:100%; border-collapse:collapse; font-size:13px; min-width:860px}
  th{color:var(--muted); text-align:left; font-weight:600; font-size:11px;
     text-transform:uppercase; letter-spacing:.5px; padding:10px 12px;
     border-bottom:1px solid var(--line); white-space:nowrap}
  td{padding:9px 12px; border-bottom:1px solid #2b3136; vertical-align:middle;
     white-space:nowrap}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:var(--hover)}
  .mut{color:var(--muted)} .sm{font-size:12px}
  .mono{font-family:Consolas,Menlo,monospace; font-size:12px}
  .cut{max-width:230px; overflow:hidden; text-overflow:ellipsis}
  /* badges */
  .b{display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px;
     font-weight:700; letter-spacing:.3px}
  .b.green{background:rgba(63,222,158,.14); color:var(--mint)}
  .b.red{background:rgba(240,97,109,.14); color:var(--danger)}
  .b.gray{background:rgba(154,164,171,.14); color:var(--muted)}
  .b.yellow{background:rgba(227,179,65,.14); color:var(--warn)}
  .b.blue{background:rgba(88,166,255,.14); color:var(--blue)}
  /* avatar */
  .av{width:30px; height:30px; border-radius:50%; display:flex; align-items:center;
      justify-content:center; font-weight:700; font-size:13px; color:#14201a;
      background:var(--mint); overflow:hidden; flex:none}
  .av img{width:100%; height:100%; object-fit:cover}
  .avcell{display:flex; align-items:center; gap:9px}
  /* buttons */
  button{font:inherit; cursor:pointer; border:none; border-radius:7px;
         padding:6px 12px; font-weight:600; font-size:12px; background:var(--panel2);
         color:var(--text)}
  button:hover{background:var(--hover)}
  button.pri{background:var(--mint); color:#14201a}
  button.pri:hover{filter:brightness(1.1)}
  button.dng{background:rgba(240,97,109,.15); color:var(--danger)}
  button.dng:hover{background:rgba(240,97,109,.3)}
  button.warn{background:rgba(227,179,65,.15); color:var(--warn)}
  button:disabled{opacity:.45; cursor:default}
  .acts{display:flex; gap:6px}
  /* modal + toast */
  #scrim{position:fixed; inset:0; background:rgba(10,12,14,.62); display:none;
         align-items:center; justify-content:center; z-index:40}
  #modal{background:var(--panel); border:1px solid var(--line); border-radius:12px;
         padding:22px; width:min(440px,92vw)}
  #modal h3{font-size:15px; margin-bottom:8px}
  #modal p{color:var(--muted); font-size:13px; white-space:pre-wrap}
  #modal input{width:100%; margin-top:12px; display:none; background:var(--bg);
               border:1px solid var(--line); border-radius:7px; color:var(--text);
               padding:9px 11px; font:inherit}
  #modal .row{display:flex; gap:8px; justify-content:flex-end; margin-top:18px}
  #toasts{position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column;
          gap:8px; z-index:50}
  .toast{background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--mint);
         border-radius:8px; padding:10px 14px; font-size:13px; max-width:380px;
         box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .toast.err{border-left-color:var(--danger)}
  .empty{padding:28px; text-align:center; color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>Duluka Server <span>Admin Console</span></h1>
  <div id="dbpath" class="mono" title=""></div>
  <div id="live">● <b>live</b> · auto-refresh 5s</div>
</header>
<main>
  <section id="cards"></section>
  <nav id="tabs">
    <button class="tab on" data-t="accounts">Accounts</button>
    <button class="tab" data-t="sessions">Sessions</button>
    <button class="tab" data-t="devices">Devices</button>
    <button class="tab" data-t="links">Provider links</button>
  </nav>
  <section class="wrap" id="content"><div class="empty">Loading…</div></section>
</main>
<div id="scrim"><div id="modal">
  <h3 id="m-title"></h3><p id="m-msg"></p>
  <input id="m-input" type="text" maxlength="64">
  <div class="row">
    <button id="m-cancel">Cancel</button>
    <button id="m-ok" class="pri">Confirm</button>
  </div>
</div></div>
<div id="toasts"></div>

<script>
'use strict';
const H = {'X-Admin-Request':'1'};
let TAB = 'accounts';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cut = s => `<span class="cut" title="${esc(s)}">${esc(s)}</span>`;

function fmt(t){ if(!t) return '—';
  const d = new Date(t);
  return d.toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',
    hour:'2-digit',minute:'2-digit'}); }
function ago(t){ if(!t) return '—';
  const s = (Date.now() - new Date(t).getTime())/1000;
  if(s<60) return 'just now'; if(s<3600) return (s/60|0)+'m ago';
  if(s<86400) return (s/3600|0)+'h ago'; return (s/86400|0)+'d ago'; }

async function api(path, opts={}){
  const r = await fetch(path, {...opts, headers:{...H, ...(opts.headers||{})}});
  const body = await r.json().catch(()=>({}));
  if(!r.ok || body.ok === false){
    throw new Error(body.message || ('HTTP '+r.status));
  }
  return body.resource ?? body;
}

function toast(msg, err){
  const el = document.createElement('div');
  el.className = 'toast' + (err ? ' err' : '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(()=>el.remove(), 4200);
}

/* ── confirm / prompt modal ─────────────────────────────────────────── */
function modal({title, msg, input=null, ok='Confirm', danger=false}){
  return new Promise(res=>{
    $('#m-title').textContent = title;
    $('#m-msg').textContent = msg;
    const inp = $('#m-input');
    inp.style.display = input===null ? 'none' : 'block';
    if(input!==null) inp.value = input;
    const okB = $('#m-ok');
    okB.className = danger ? 'dng' : 'pri';
    okB.textContent = ok;
    $('#scrim').style.display = 'flex';
    if(input!==null){ inp.focus(); inp.select(); }
    const done = v => { $('#scrim').style.display='none';
      okB.onclick = $('#m-cancel').onclick = inp.onkeydown = null; res(v); };
    okB.onclick = () => done(input===null ? true : inp.value);
    $('#m-cancel').onclick = () => done(null);
    inp.onkeydown = e => { if(e.key==='Enter') okB.click();
                           if(e.key==='Escape') done(null); };
  });
}

/* ── overview cards ─────────────────────────────────────────────────── */
async function loadOverview(){
  try{
    const o = await api('/admin/api/overview');
    $('#dbpath').textContent = o.dbPath;
    $('#dbpath').title = o.dbPath;
    const cards = [
      ['Accounts', o.accounts],
      ['Active sessions', o.activeSessions],
      ['Active devices', o.activeDevices],
      ['Provider links', o.activeLinks],
      ['Native credentials', o.nativeCredentials],
    ];
    $('#cards').innerHTML = cards.map(([l,n]) =>
      `<div class="card"><div class="num">${n}</div><div class="lbl">${esc(l)}</div></div>`).join('');
  }catch(e){ toast('Overview: '+e.message, true); }
}

/* ── tables ─────────────────────────────────────────────────────────── */
function badge(ok, text){
  return `<span class="b ${ok==='green'?'green':ok==='red'?'red':ok==='yellow'?'yellow':ok==='blue'?'blue':'gray'}">${esc(text)}</span>`;
}
function avatarCell(a){
  const name = a.displayName || a.username || '?';
  const letter = esc(name.charAt(0).toUpperCase());
  const img = a.hasProfileImage
    ? `<img src="/admin/api/accounts/${encodeURIComponent(a.accountId)}/avatar"
        onerror="this.remove()">` : '';
  return `<div class="avcell"><div class="av">${letter}${img}</div>
    <div><div>${esc(a.displayName ?? '(no display name)')}</div>
    <div class="sm mut">${esc(a.username ?? 'no native credential')}</div></div></div>`;
}

const TABLES = {
  accounts: {
    load: () => api('/admin/api/accounts'),
    render: rows => rows.map(a => `<tr>
      <td>${avatarCell(a)}</td>
      <td>${badge(a.status==='Active'?'green':a.status==='Suspended'?'yellow':'gray', a.status)}</td>
      <td class="mono sm mut">${cut(a.accountId)}</td>
      <td>${fmt(a.createdAt)}</td>
      <td>${ago(a.updatedAt)}</td>
      <td class="sm">${a.activeSessions}/${a.devices} dev · ${a.activeLinks} link</td>
      <td><div class="acts">
        <button onclick="renameAccount('${esc(a.accountId)}','${esc(a.displayName ?? '')}')">Rename</button>
        ${a.hasProfileImage ? `<button onclick="clearImage('${esc(a.accountId)}')">Clear image</button>` : ''}
        ${a.status==='Active'
          ? `<button class="warn" onclick="setStatus('${esc(a.accountId)}','Suspended')">Suspend</button>`
          : `<button class="pri" onclick="setStatus('${esc(a.accountId)}','Active')">Activate</button>`}
        <button class="dng" onclick="deleteAccount('${esc(a.accountId)}')">Delete</button>
      </div></td></tr>`).join('') || `<tr><td colspan="7"><div class="empty">No accounts yet — register one from the Overlay.</div></td></tr>`,
    head: `<tr><th>Account</th><th>Status</th><th>Id</th><th>Created</th>
           <th>Updated</th><th>Usage</th><th>Actions</th></tr>`,
  },
  sessions: {
    load: () => api('/admin/api/sessions'),
    render: rows => rows.map(s => {
      const st = s.revokedAt ? ['red','revoked']
               : new Date(s.expiresAt) <= new Date() ? ['gray','expired'] : ['green','active'];
      return `<tr>
      <td class="mono sm mut">${cut(s.sessionId)}</td>
      <td>${esc(s.accountLabel)}</td>
      <td>${esc(s.deviceName ?? '—')}</td>
      <td>${fmt(s.createdAt)}</td>
      <td>${fmt(s.expiresAt)}</td>
      <td>${ago(s.lastSeenAt)}</td>
      <td>${badge(...st)}${s.revokedReason?` <span class="sm mut">${esc(s.revokedReason)}</span>`:''}</td>
      <td>${st[1]==='active' ? `<button class="dng" onclick="revokeSession('${esc(s.sessionId)}')">Revoke</button>` : ''}</td>
    </tr>`;}).join('') || `<tr><td colspan="8"><div class="empty">No sessions.</div></td></tr>`,
    head: `<tr><th>Session</th><th>Account</th><th>Device</th><th>Created</th>
           <th>Expires</th><th>Last seen</th><th>Status</th><th></th></tr>`,
  },
  devices: {
    load: () => api('/admin/api/devices'),
    render: rows => rows.map(d => `<tr>
      <td>${esc(d.deviceName)}</td>
      <td class="mono sm mut">${cut(d.deviceId)}</td>
      <td>${esc(d.accountLabel)}</td>
      <td>${fmt(d.createdAt)}</td>
      <td>${ago(d.lastSeenAt)}</td>
      <td>${d.revokedAt ? badge('red','revoked') : badge('green','active')}</td>
      <td class="sm">${d.activeSessions}</td>
      <td><div class="acts">
        ${!d.revokedAt ? `<button class="warn" onclick="revokeDevice('${esc(d.deviceId)}')">Revoke</button>` : ''}
        <button class="dng" onclick="deleteDevice('${esc(d.deviceId)}')">Delete</button>
      </div></td></tr>`).join('') || `<tr><td colspan="8"><div class="empty">No devices.</div></td></tr>`,
    head: `<tr><th>Device</th><th>Id</th><th>Account</th><th>Created</th>
           <th>Last seen</th><th>Status</th><th>Live sess.</th><th>Actions</th></tr>`,
  },
  links: {
    load: () => api('/admin/api/links'),
    render: rows => rows.map(l => `<tr>
      <td>${badge('blue', l.providerKey)}</td>
      <td class="mono sm">${esc(l.providerUserId)}</td>
      <td>${esc(l.providerEmail ?? '—')}</td>
      <td>${esc(l.accountLabel)}</td>
      <td>${l.status==='Active' ? badge('green','active') : badge('gray','unlinked')}</td>
      <td>${fmt(l.linkedAt)}</td>
      <td>${l.status==='Active' ? `<button class="dng" onclick="unlinkLink('${esc(l.linkId)}')">Unlink</button>` : ''}</td>
    </tr>`).join('') || `<tr><td colspan="7"><div class="empty">No provider links.</div></td></tr>`,
    head: `<tr><th>Provider</th><th>Provider user</th><th>Email</th><th>Account</th>
           <th>Status</th><th>Linked</th><th></th></tr>`,
  },
};

async function loadTab(){
  const t = TABLES[TAB];
  $('#content').innerHTML = `<div class="empty">Loading…</div>`;
  try{
    const body = await t.load();
    const rows = body.accounts ?? body.sessions ?? body.devices ?? body.links ?? [];
    $('#content').innerHTML = `<table>${t.head}<tbody>${t.render(rows)}</tbody></table>`;
  }catch(e){
    $('#content').innerHTML = `<div class="empty">Failed: ${esc(e.message)}</div>`;
  }
}

/* ── actions ────────────────────────────────────────────────────────── */
window.renameAccount = async (id, current) => {
  const name = await modal({title:'Rename display name', input:current, ok:'Save',
    msg:'Only the presentation name changes — identity, username, devices and sessions stay untouched.'});
  if(name === null) return;
  try{ await api(`/admin/api/accounts/${encodeURIComponent(id)}/profile`,
        {method:'PATCH', body:JSON.stringify({displayName:name})});
       toast('Display name updated.'); refresh(); }
  catch(e){ toast(e.message, true); }
};
window.clearImage = async id => {
  if(!await modal({title:'Clear profile image?', danger:true, ok:'Clear',
    msg:'The account falls back to the letter avatar. The display name is kept.'})) return;
  try{ await api(`/admin/api/accounts/${encodeURIComponent(id)}/profile/image`, {method:'DELETE'});
       toast('Profile image cleared.'); refresh(); }
  catch(e){ toast(e.message, true); }
};
window.setStatus = async (id, status) => {
  const suspending = status === 'Suspended';
  if(await modal({title:(suspending?'Suspend':'Activate')+' account?',
      ok:suspending?'Suspend':'Activate', danger:suspending,
      msg:suspending ? 'Every session fails validation on its next request — the account cannot sign in until re-activated.'
                     : 'The account can sign in again immediately.'}) === null) return;
  try{ await api(`/admin/api/accounts/${encodeURIComponent(id)}/status`,
        {method:'POST', body:JSON.stringify({status})});
       toast('Account is now '+status+'.'); refresh(); }
  catch(e){ toast(e.message, true); }
};
window.deleteAccount = async id => {
  if(await modal({title:'DELETE this account?', ok:'Delete forever', danger:true,
      msg:'Removes the account AND all of its sessions, devices, provider links, sync profiles and native credential in one transaction. This cannot be undone.\n\n'+id}) === null) return;
  try{ await api(`/admin/api/accounts/${encodeURIComponent(id)}`, {method:'DELETE'});
       toast('Account deleted.'); refresh(); }
  catch(e){ toast(e.message, true); }
};
window.revokeSession = async id => {
  if(await modal({title:'Revoke session?', ok:'Revoke', danger:true,
      msg:'The next authenticated call from this session gets 401 and the Overlay signs the account out.'}) === null) return;
  try{ await api(`/admin/api/sessions/${encodeURIComponent(id)}`, {method:'DELETE'});
       toast('Session revoked.'); refresh(); }
  catch(e){ toast(e.message, true); }
};
window.revokeDevice = async id => {
  if(await modal({title:'Revoke device?', ok:'Revoke', danger:true,
      msg:'The device can no longer sign in; its live sessions are revoked. History rows are kept.'}) === null) return;
  try{ await api(`/admin/api/devices/${encodeURIComponent(id)}/revoke`, {method:'POST'});
       toast('Device revoked.'); refresh(); }
  catch(e){ toast(e.message, true); }
};
window.deleteDevice = async id => {
  if(await modal({title:'DELETE device?', ok:'Delete forever', danger:true,
      msg:'Hard-deletes the device row AND all of its sessions (including history). The device must sign in again with a fresh device key.\n\n'+id}) === null) return;
  try{ await api(`/admin/api/devices/${encodeURIComponent(id)}`, {method:'DELETE'});
       toast('Device deleted.'); refresh(); }
  catch(e){ toast(e.message, true); }
};
window.unlinkLink = async id => {
  if(await modal({title:'Unlink provider?', ok:'Unlink', danger:true,
      msg:'The provider identity is detached and its sessions are revoked. The account keeps everything else.'}) === null) return;
  try{ await api(`/admin/api/links/${encodeURIComponent(id)}/unlink`, {method:'POST'});
       toast('Provider unlinked.'); refresh(); }
  catch(e){ toast(e.message, true); }
};

/* ── wiring ─────────────────────────────────────────────────────────── */
function refresh(){ loadOverview(); loadTab(); }
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  TAB = b.dataset.t; loadTab();
});
refresh();
setInterval(loadOverview, 5000);
</script>
</body>
</html>
